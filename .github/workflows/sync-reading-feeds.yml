# Refreshes /reading/ from Noa's public feeds:
#   · Goodreads "currently reading" shelf → Books
#   · Instapaper public folder            → Articles
# Runs daily, and on demand from the Actions tab ("Run workflow").
# GitHub Pages can't read these feeds in the visitor's browser (the sites
# don't allow cross-site requests), so this job writes them into the page.
name: Sync reading feeds

on:
  schedule:
    - cron: "17 11 * * *"   # daily, around 6–7 AM Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-reading-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the feeds into reading/index.html
        run: python3 .github/scripts/sync_reading_feeds.py
      - name: Commit if the page changed
        run: |
          if git diff --quiet -- reading/index.html; then
            echo "Reading page already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add reading/index.html
          git commit -m "Refresh reading feeds from Goodreads and Instapaper"
          git push
